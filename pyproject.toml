[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecity"
version = "0.1.0"
description = "A local-first voice studio for Urdu and English speech generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED - project license decision pending" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
